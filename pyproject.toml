[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "llm-wiki-ops"
dynamic = ["version"]
description = "LLM-oriented operational framework for durable Markdown knowledge bases"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ar9av" }]
maintainers = [{ name = "evanzlh" }]
keywords = [
  "obsidian",
  "wiki",
  "knowledge-base",
  "llm",
  "claude",
  "agent-skills",
  "second-brain",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Utilities",
]
dependencies = [
  "packaging>=24",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
# Higher-fidelity AST extraction (tree-sitter parses real ASTs; regex is the default fallback).
ast = ["tree-sitter>=0.21", "tree-sitter-languages>=1.10"]
# Higher-fidelity community detection (Leiden algorithm; greedy label propagation is the default fallback).
graph = ["leidenalg>=0.10", "igraph>=0.11"]

[project.urls]
Homepage = "https://github.com/evanzlh/llm-wiki-ops"
Repository = "https://github.com/evanzlh/llm-wiki-ops"
Issues = "https://github.com/evanzlh/llm-wiki-ops/issues"
Changelog = "https://github.com/evanzlh/llm-wiki-ops/releases"
Upstream = "https://github.com/Ar9av/obsidian-wiki"

[project.scripts]
llmwikiops = "obsidian_wiki.cli:main"

# Version is derived from the git tag (CalVer, e.g. v2026.05.2 -> 2026.5.2),
# matching the repo's release tags. Tagging a release is the version bump.
[tool.hatch.version]
source = "vcs"

# ── Build configuration ──────────────────────────────────────────────────────
# Runtime skills and bootstrap templates live canonically under
# obsidian_wiki/_data/, so source checkouts and built artifacts use identical
# paths.

[tool.hatch.build.targets.wheel]
packages = ["obsidian_wiki"]
exclude = [
  "**/__pycache__",
  "**/*.py[co]",
]

[tool.hatch.build.targets.sdist]
# Prune build noise and project-local agent configuration.
exclude = [
  "/.claude",
  "/dist",
  "/build",
]
