[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "obsidian-wiki"
dynamic = ["version"]
description = "A skill-based framework for building and maintaining an AI-maintained Obsidian knowledge base (Karpathy's LLM Wiki pattern) across any AI coding agent."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ar9av" }]
maintainers = [{ name = "evanzlh" }]
keywords = [
  "obsidian",
  "wiki",
  "knowledge-base",
  "llm",
  "claude",
  "agent-skills",
  "second-brain",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Utilities",
]
dependencies = [
  "packaging>=24",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
# Higher-fidelity AST extraction (tree-sitter parses real ASTs; regex is the default fallback).
ast = ["tree-sitter>=0.21", "tree-sitter-languages>=1.10"]
# Higher-fidelity community detection (Leiden algorithm; greedy label propagation is the default fallback).
graph = ["leidenalg>=0.10", "igraph>=0.11"]

[project.urls]
Homepage = "https://github.com/evanzlh/obsidian-wiki"
Repository = "https://github.com/evanzlh/obsidian-wiki"
Issues = "https://github.com/evanzlh/obsidian-wiki/issues"
Upstream = "https://github.com/Ar9av/obsidian-wiki"

[project.scripts]
obsidian-wiki = "obsidian_wiki.cli:main"

# Version is derived from the git tag (CalVer, e.g. v2026.05.2 -> 2026.5.2),
# matching the repo's release tags. Tagging a release is the version bump.
[tool.hatch.version]
source = "vcs"

# ── Build configuration ──────────────────────────────────────────────────────
# Runtime skills and bootstrap templates live canonically under
# obsidian_wiki/_data/, so source checkouts and built artifacts use identical
# paths. The remaining force-includes copy non-package runtime support files.

[tool.hatch.build.targets.wheel]
packages = ["obsidian_wiki"]
# force-include copies straight from the working tree, not a VCS-filtered
# view — without this, a local `scripts/__pycache__` picked up stray .pyc
# files into the locally built wheel used for source installation.
exclude = [
  "**/__pycache__",
  "**/*.py[co]",
]

[tool.hatch.build.targets.wheel.force-include]
"scripts" = "obsidian_wiki/_data/scripts"
".env.example" = "obsidian_wiki/_data/.env.example"

[tool.hatch.build.targets.sdist]
# Prune build noise and project-local agent configuration.
exclude = [
  "/.claude",
  "/dist",
  "/build",
]
